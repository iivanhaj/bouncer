name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    # The tests run against real Postgres and Redis, like production, not mocks or SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelguard
          POSTGRES_PASSWORD: modelguard
          POSTGRES_DB: modelguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelguard"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      MODELGUARD_TEST_DATABASE_URL: postgresql+asyncpg://modelguard:modelguard@localhost:5432/modelguard_test
      MODELGUARD_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q -p no:warnings
      - name: Redaction quality
        run: python -m evals.redaction_eval
      - name: Injection detection quality
        run: python -m evals.injection_eval

  dashboard:
    name: Dashboard lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Route types (PageProps, LayoutProps) are generated by Next; tsc needs them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gateway image
        run: docker build -t modelguard-gateway .
      - name: Dashboard image
        run: docker build -t modelguard-dashboard dashboard
