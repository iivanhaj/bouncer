# Models the gateway routes to. This is an allowlist: a model not listed here is rejected with
# 404 before any upstream is contacted (DESIGN.md §5).
#
#   upstream          name of an upstream in MODELGUARD_UPSTREAMS (see app/config.py)
#   upstream_model    the model's name on that upstream
#   *_price_per_1k    notional USD per 1,000 tokens, used to compute cost in the usage log.
#                     Local models cost nothing to run; these show what a hosted equivalent would cost.

models:
  qwen2.5:0.5b:
    upstream: ollama
    upstream_model: qwen2.5:0.5b
    input_price_per_1k: 0.0001
    output_price_per_1k: 0.0002

  llama3.2:3b:
    upstream: ollama
    upstream_model: llama3.2:3b
    input_price_per_1k: 0.0002
    output_price_per_1k: 0.0004

  # Fake model for load tests: fast and predictable, so measurements show the gateway's overhead.
  mock:
    upstream: mock
    upstream_model: mock
    input_price_per_1k: 0.0
    output_price_per_1k: 0.0
