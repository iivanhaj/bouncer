apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelguard

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - mock-upstream.yaml
  - gateway.yaml
  - dashboard.yaml
  - prometheus.yaml
  - ingress.yaml

# The hash suffix makes Prometheus restart when its config changes.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml

# Created by k8s/setup.sh, not here: modelguard-secrets (from .env, never committed) and
# gateway-models (from ../models.yaml, which kustomize may not read from outside this folder).
