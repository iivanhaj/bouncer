# Local cluster: one node, with the ingress controller's ports mapped to the host so
# http://localhost/v1/... reaches the gateway through the ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bouncer
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
