[project]
name = "bouncer"
version = "0.1.0"
description = "Self-hosted LLM gateway with security guardrails"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "certifi",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff==0.8.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mock_upstream*"]

[tool.setuptools.package-data]
app = ["lua/*.lua", "injection_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic generates these; they're kept as generated.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, B: likely bugs, UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]
# B008 flags function calls in default arguments, but Depends(...) there is how FastAPI works.
ignore = ["B008"]
